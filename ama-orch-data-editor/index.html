<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183a37">
    <title>ama-orch data editor</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">AMA-ORCH</p>
                <h1>データエディタ</h1>
                <p class="subtitle">ama-orchのデータを確認して、必要なところだけ編集します。</p>
            </div>
            <div class="header-actions">
                <label class="button secondary" for="fileInput">JSONを開く</label>
                <input id="fileInput" type="file" accept="application/json,.json" hidden>
                <button id="sampleButton" class="button secondary" type="button">サンプルを表示</button>
                <button id="downloadButton" class="button primary" type="button">JSONを保存</button>
            </div>
        </header>

        <section class="toolbar" aria-label="データ操作">
            <div>
                <strong id="fileName">ファイル未選択</strong>
                <span id="rowCount" class="muted">0件</span>
            </div>
            <div class="toolbar-actions">
                <button id="addButton" class="button small" type="button">行を追加</button>
                <button id="clearButton" class="button small danger" type="button">全消去</button>
            </div>
        </section>

        <section id="message" class="message" role="status" aria-live="polite"></section>
        <section class="editor-panel">
            <div class="table-wrap">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div id="emptyState" class="empty-state">JSONファイルを開くか、サンプルを表示してください。</div>
            </div>
        </section>

        <section class="upload-panel">
            <div>
                <p class="eyebrow">OPTIONAL CONNECTION</p>
                <h2>Webアプリへ送信</h2>
                <p class="muted">受け付けるAPIのURLを入力した場合だけ送信できます。</p>
            </div>
            <div class="upload-controls">
                <input id="endpointInput" type="url" placeholder="https://example.com/api/data/import"
                    aria-label="アップロード先URL">
                <button id="uploadButton" class="button primary" type="button">送信</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
